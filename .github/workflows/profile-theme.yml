name: Switch profile day/night

on:
  schedule:
    - cron: "0 7,19 * * *"
      timezone: Europe/London
    # Start Christmas on December 1; restore normal themes on January 1.
    - cron: "0 0 1 1,12 *"
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-theme
  cancel-in-progress: false

jobs:
  switch-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update README image
        run: |
          python3 <<'PY'
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/London"))
          is_daytime = 7 <= now.hour < 19
          is_national_day = (now.month, now.day) == (10, 10)

          if now.month == 12:
              image = (
                  "cyberpunk-christmas-day.gif"
                  if is_daytime
                  else "cyberpunk-christmas-night.gif"
              )
          elif is_daytime and is_national_day:
              image = "cyberpunk-taiwan-day.gif"
          elif is_daytime:
              image = "cyberpunk-day.gif"
          else:
              image = "cyberpunk-profile.gif"

          if not Path(image).is_file():
              raise SystemExit(f"Missing image: {image}")

          readme = Path("README.md")
          content, matches = re.subn(
              r"(?<=\./)cyberpunk-(?:profile|day|taiwan-day|christmas-day|christmas-night)\.gif",
              image,
              readme.read_text(),
          )
          if not matches:
              raise SystemExit("No matching profile image found in README.md")
          readme.write_text(content)
          print(f"Selected {image} at {now.isoformat()}")
          PY

      - name: Commit if changed
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo "Already showing the correct theme."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update profile day/night theme"
          git push origin HEAD:main
